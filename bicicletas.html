<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bicicletas e Acessórios — G4bikes Bike Shop | São Paulo</title>
  <meta name="description" content="Catálogo completo da G4bikes: mountain bikes, elétricas, urbanas, estrada, infantis, BMX, capacetes, peças e acessórios. Filtros por preço, aro, marchas e mais.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='white'/%3E%3Ctext x='50' y='64' font-size='44' text-anchor='middle' font-family='Arial' font-weight='bold' font-style='italic'%3E%3Ctspan fill='%23e8392c'%3EG%3C/tspan%3E%3Ctspan fill='%232438cf'%3E4%3C/tspan%3E%3C/text%3E%3Ctext x='50' y='84' font-size='17' text-anchor='middle' font-family='Arial' font-weight='bold' font-style='italic' fill='%23f28a2e'%3EBikes%3C/text%3E%3C/svg%3E">
</head>
<body>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <nav class="breadcrumb" aria-label="Você está em"><a href="index.html">Início</a> <span>/</span> <span id="crumbHere">Bicicletas</span></nav>
      <h1 id="pageTitle">Bicicletas</h1>
      <p class="section-sub" id="pageSub">Todos os modelos revisados e entregues prontos para pedalar.</p>
    </div>
  </section>

  <section class="section" style="padding-top:44px">
    <div class="container catalog-layout">

      <!-- ============ FILTROS ============ -->
      <aside class="filters" id="filters" aria-label="Filtros de produtos">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b style="font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px">Filtros</b>
          <button class="btn btn-outline btn-sm" onclick="clearFilters()">Limpar</button>
        </div>
        <details class="filter-group" open><summary>Categoria</summary><div class="filter-body" id="fCat"></div></details>
        <details class="filter-group" open><summary>Faixa de preço</summary>
          <div class="filter-body">
            <div class="range-row">
              <input type="number" id="fMin" placeholder="Mín R$" min="0" aria-label="Preço mínimo">
              <input type="number" id="fMax" placeholder="Máx R$" min="0" aria-label="Preço máximo">
            </div>
          </div>
        </details>
        <details class="filter-group"><summary>Marca</summary><div class="filter-body" id="fMarca"></div></details>
        <details class="filter-group"><summary>Tamanho do quadro</summary><div class="filter-body" id="fTam"></div></details>
        <details class="filter-group"><summary>Tamanho do aro</summary><div class="filter-body" id="fAro"></div></details>
        <details class="filter-group"><summary>Material do quadro</summary><div class="filter-body" id="fMat"></div></details>
        <details class="filter-group"><summary>Cor</summary><div class="filter-body" id="fCor"></div></details>
        <details class="filter-group"><summary>Modalidade</summary><div class="filter-body" id="fMod"></div></details>
        <details class="filter-group"><summary>Suspensão</summary><div class="filter-body" id="fSusp"></div></details>
        <details class="filter-group"><summary>Tipo de freio</summary><div class="filter-body" id="fFreio"></div></details>
        <details class="filter-group"><summary>Marchas</summary><div class="filter-body" id="fMarchas"></div></details>
        <details class="filter-group"><summary>Disponibilidade</summary>
          <div class="filter-body">
            <label class="check"><input type="checkbox" id="fEstoque" onchange="applyFilters()"> Pronta entrega</label>
            <label class="check"><input type="checkbox" id="fPromo" onchange="applyFilters()"> Em promoção</label>
          </div>
        </details>
        <details class="filter-group"><summary>Avaliação</summary>
          <div class="filter-body">
            <label class="check"><input type="radio" name="fAval" value="0" checked onchange="applyFilters()"> Todas</label>
            <label class="check"><input type="radio" name="fAval" value="4.8" onchange="applyFilters()"> ★ 4.8 ou mais</label>
            <label class="check"><input type="radio" name="fAval" value="5" onchange="applyFilters()"> ★ 5.0</label>
          </div>
        </details>
        <button class="btn btn-primary btn-block" onclick="document.getElementById('filters').classList.remove('open')" style="margin-top:6px">Ver resultados</button>
      </aside>

      <!-- ============ RESULTADOS ============ -->
      <div>
        <div class="catalog-topbar">
          <button class="btn btn-outline btn-sm filters-toggle" onclick="document.getElementById('filters').classList.add('open')">☰ Filtros</button>
          <span class="count" id="resultCount" role="status"></span>
          <select class="sort-select" id="sortSel" aria-label="Ordenar produtos" onchange="applyFilters()">
            <option value="relev">Mais relevantes</option>
            <option value="vendidos">Mais vendidos</option>
            <option value="menor">Menor preço</option>
            <option value="maior">Maior preço</option>
            <option value="lancamento">Lançamentos</option>
            <option value="avaliacao">Melhores avaliações</option>
          </select>
        </div>
        <div class="prod-grid" id="grid"></div>
      </div>
    </div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
